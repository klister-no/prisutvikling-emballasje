name: Oppdater prisdata

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  beskytt-design:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Hent repoet
        uses: actions/checkout@v4

      - name: Beskytt index.html
        run: |
          git config --global user.name "Rapport-bot"
          git config --global user.email "rapport-bot@github.com"
          echo "Automatisk oppdatering deaktivert - index.html endres kun manuelt"
