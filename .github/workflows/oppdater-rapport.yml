name: Oppdater prisanalyse

on:
  schedule:
    - cron: '0 3 * * 0'   # Søndag kl. 03:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generer-analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Hent repoet
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install anthropic

      - name: Generer prisanalyse
        env:
          EMBALLASJE_RAPPORT_CLOUDE_KEY: ${{ secrets.EMBALLASJE_RAPPORT_CLOUDE_KEY }}
        run: python update_report.py

      - name: Commit data/analysis.json
        run: |
          git config --global user.name "Rapport-bot"
          git config --global user.email "rapport-bot@github.com"
          git checkout HEAD -- index.html
          git add data/analysis.json
          git diff --staged --quiet || git commit -m "AI-analyse oppdatert $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
